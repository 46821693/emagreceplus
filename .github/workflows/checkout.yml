name: Conectar checkout Kiwify

on:
  push:
    paths:
      - '.github/workflows/checkout.yml'

permissions:
  contents: write

jobs:
  checkout:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Corrigir checkout Kiwify
        run: |
          python3 - <<'PY'
          from pathlib import Path

          arquivo = Path("index.html")
          html = arquivo.read_text(encoding="utf-8")

          checkout = "https://pay.kiwify.com.br/z6vEF8y"

          html = html.replace("#checkout", checkout)

          marcador = "<!-- EMAGRECEPLUS_KIWIFY_FIX -->"

          patch = f'''
          {marcador}
          <script>
          document.addEventListener('click', function(e) {{
            const el = e.target.closest('a,button');
            if (!el) return;

            const href = (el.getAttribute('href') || '').trim();
            const text = (el.textContent || '').toLowerCase();

            const ehCheckout =
              href === '#checkout' ||
              href === checkout ||
              /comprar|quero|garantir|começar agora|comece agora|adquirir|inscrever/.test(text);

            if (ehCheckout) {{
              e.preventDefault();
              e.stopImmediatePropagation();
              window.location.assign(checkout);
            }}
          }}, true);
          </script>
          '''

          if marcador not in html:
              html = html.replace("</body>", patch + "</body>", 1)

          arquivo.write_text(html, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrigir botao de checkout Kiwify" || echo "Nenhuma alteração necessária"
          git push
